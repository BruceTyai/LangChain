services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: jfjbjfjb
      MYSQL_DATABASE: knowledge_base
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pjfjbjfjb"], interval: 10s, timeout: 5s, retries: 10}
  chroma:
    image: chromadb/chroma:1.0.20
    ports: ["8000:8000"]
    volumes: [chroma_data:/data]
volumes: {mysql_data: {}, chroma_data: {}}
