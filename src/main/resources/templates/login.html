<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 技术保障部知识库系统</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-card">
    <div class="login-brand"><span>技</span><div><b>技术保障部知识库系统</b><small>TECH SUPPORT KNOWLEDGE</small></div></div>
    <div class="login-heading"><p>欢迎回来</p><h1>登录知识工作区</h1><span>管理员可维护知识库，普通用户可进行知识问答。</span></div>
    <p class="notice error" th:if="${param.error}">用户名或密码错误，请重新输入。</p>
    <p class="notice success" th:if="${param.logout}">已安全退出登录。</p>
    <p class="notice error" th:if="${param.expired}">登录状态已失效，请重新登录。</p>
    <form th:action="@{/login}" method="post">
      <label>用户名<input name="username" autocomplete="username" autofocus required></label>
      <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
    </form>
    <p class="login-help">首次登录账号：admin，初始密码：123456。登录后请立即修改密码。</p>
  </main>
</body>
</html>
